name: Release

# Fires only on a version tag that a maintainer pushes deliberately. Nothing
# here runs on a normal push or pull request.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and validate without publishing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # Required for npm provenance, which signs the package against this
      # workflow run so consumers can verify where it was built.
      id-token: write

    steps:
      - uses: actions/checkout@v7

      # A manual run on a branch with "dry run" unchecked satisfies neither
      # the Publish condition nor the Dry run condition: every check would
      # pass, nothing would publish, and the run would finish green. Refuse it
      # up front instead.
      - name: Refuse a non-dry-run on anything but a version tag
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true && !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "Nothing to publish from a branch: check 'dry run', or push a v* tag." >&2
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      # The same gate CI runs. prepublishOnly runs it again during publish;
      # running it here fails fast, before anything is built or uploaded.
      - name: Check
        run: npm run check

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Bundle size budget
        run: npm run size

      - name: Validate published package
        run: npx --no-install publint

      - name: Validate published types
        run: npx --no-install attw --pack

      - name: Confirm the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG" >&2
            exit 1
          fi
          echo "Publishing $PKG"

      # On a tag push `inputs` is empty, so `inputs.dry_run != true` holds;
      # the same condition lets a workflow_dispatch aimed at a tag publish too.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run
        if: inputs.dry_run == true
        run: npm publish --dry-run
